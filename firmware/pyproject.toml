[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscan-mini"
version = "0.2.0-dev"
description = "OpenScan Mini - High-Performance 3D Scanner Firmware (Refactored, 64-bit Bookworm)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    {name = "OpenScan Refactor", email = "dev@openscan-mini.local"},
]
keywords = ["3d-scanning", "photogrammetry", "robotics", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",

    # GPIO & Hardware Control
    "gpiozero>=2.0.0",
    "RPi.GPIO>=0.7.0;platform_machine=='armv7l' or platform_machine=='aarch64'",

    # Camera Control
    "picamera2>=0.5.0;platform_machine=='aarch64'",
    "Pillow>=10.0.0",

    # Computer Vision
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",

    # ArUco & Image Processing
    "scikit-image>=0.22.0",

    # Scheduling & Async
    "APScheduler>=3.10.0",
    "asyncio-contextmanager>=1.0.0",

    # Configuration & Data
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Logging
    "python-json-logger>=2.0.0",

    # Data Serialization
    "orjson>=3.9.0",

    # Networking & HTTP
    "httpx>=0.25.0",
    "websockets>=12.0",

    # Database / File Storage
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "ruff>=0.13.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

photogrammetry = [
    "colmap>=3.9.0;platform_machine=='aarch64'",
]

jetson = [
    "jetson-utils>=0.50.0;platform_machine=='aarch64'",
    "jetson-inference>=0.50.0;platform_machine=='aarch64'",
]

[project.urls]
Repository = "https://github.com/your-user/openscan-mini"
Documentation = "https://openscan-mini.readthedocs.io"
Issues = "https://github.com/your-user/openscan-mini/issues"

[project.scripts]
openscan-firmware = "openscan_mini.main:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["openscan_mini*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-v --cov=openscan_mini --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["openscan_mini"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "PT", "SIM", "RUF"
]
ignore = ["E501"]
exclude = [".git", "build", "dist", ".venv"]

[tool.ruff.isort]
known-first-party = ["openscan_mini"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gpiozero.*", "picamera2.*", "cv2.*"]
ignore_missing_imports = true
